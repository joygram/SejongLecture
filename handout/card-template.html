<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 팀 리포트 · 프롬프트 카드</title><style>
:root{color-scheme:light;--ink:#183b3b;--accent:#147d78}*{box-sizing:border-box}body{margin:0;background:#f8f6f0;color:var(--ink);font:16px/1.75 "Malgun Gothic",sans-serif}main{max-width:840px;margin:auto;padding:38px 20px 60px}h1{font-size:30px;line-height:1.35;margin:10px 0}h2{font-size:21px;line-height:1.5}header p{color:#526866}.label{font-size:12px;letter-spacing:2px;color:var(--accent)}article{background:#fffdf7;border:1px solid #d6e1db;border-radius:16px;padding:24px;margin:22px 0}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}button{font:inherit;font-size:13px;border:0;border-radius:8px;background:#205951;color:white;padding:9px 16px;white-space:nowrap;cursor:pointer}button:focus-visible{outline:3px solid #dfa158;outline-offset:3px}textarea{width:100%;resize:vertical;min-height:230px;border:1px solid #d6e1db;border-radius:10px;padding:16px;font:14px/1.8 "Malgun Gothic",sans-serif;background:#f4f6ef;color:var(--ink)}.think{border-left:4px solid #dfa158;padding-left:15px;font-size:14px}.hint{font-size:13px;color:#526866}footer{font-size:13px;color:#526866}a{color:var(--accent)}@media(max-width:500px){main{padding:25px 14px}article{padding:18px}.heading{align-items:flex-start}h1{font-size:25px}h2{font-size:18px}}
</style></head><body><main><header><span class="label">SEJONG / AI WRITING</span><h1>우리 팀 리포트를 끝까지 고쳐보기</h1><p>팀 과제 → 메모 → 초안 → 표·그림 확인 → 퇴고 → 완성본 → 팀 채팅 요약</p><p class="hint">같은 자료와 같은 글을 사용. 각 카드에서 살릴 문장·바꿀 문장을 선택.</p></header>
{{CARDS}}
<footer>자료: 인사혁신처 「2026년 국가공무원 7급 공채 1차 필기시험 응시현황」, 직군 계 응시 인원. 팀 대화·예문은 수업용 가상 상황.<br>도구별 환경 설정은 <a href="tool-workflows.md">보조 가이드</a>에서 확인하세요.</footer></main><script>
for(const button of document.querySelectorAll('[data-copy]'))button.addEventListener('click',async()=>{const field=document.getElementById(button.dataset.copy);const status=document.getElementById(button.dataset.copy+'-status');try{await navigator.clipboard.writeText(field.value);status.textContent='복사했어요. 채팅에 붙여넣으세요.';}catch{field.focus();field.select();status.textContent='선택된 내용을 Ctrl+C 또는 길게 눌러 복사하세요.';}});
</script></body></html>
